<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-label="리메이크 최종전의 약점"><title>리메이크 최종전의 약점</title><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect width="480" height="455" rx="15" fill="#e8eddf"/><text x="22" y="35" font-size="20" font-weight="700" fill="#253f34">리메이크 최종전의 약점</text><text x="22" y="68" font-size="13" fill="#526654">설명용 진행도 · 번호 순서 / 실제 방 배치·축척 아님</text><rect x="16" y="90" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="40" cy="116" r="15" fill="#315b43"/><text x="40" y="122" text-anchor="middle" font-size="17" fill="white">1</text><text x="64" y="120" font-size="18" fill="#253f34" font-weight="400">전반: 꼬리의</text><text x="64" y="145" font-size="18" fill="#253f34" font-weight="400">약점</text><rect x="250" y="90" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="274" cy="116" r="15" fill="#315b43"/><text x="274" y="122" text-anchor="middle" font-size="17" fill="white">2</text><text x="298" y="120" font-size="18" fill="#253f34" font-weight="400">마스터 소드 회수</text><rect x="16" y="205" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="40" cy="231" r="15" fill="#315b43"/><text x="40" y="237" text-anchor="middle" font-size="17" fill="white">3</text><text x="64" y="235" font-size="18" fill="#253f34" font-weight="400">후반: 팔의 붉은</text><text x="64" y="260" font-size="18" fill="#253f34" font-weight="400">부분</text><rect x="250" y="205" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="274" cy="231" r="15" fill="#315b43"/><text x="274" y="237" text-anchor="middle" font-size="17" fill="white">4</text><text x="298" y="235" font-size="18" fill="#253f34" font-weight="400">젤다가 힘을 제압</text><rect x="16" y="320" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="40" cy="346" r="15" fill="#315b43"/><text x="40" y="352" text-anchor="middle" font-size="17" fill="white">5</text><text x="64" y="350" font-size="18" fill="#253f34" font-weight="400">이마 눈에 빛의</text><text x="64" y="375" font-size="18" fill="#253f34" font-weight="400">화살</text><rect x="250" y="320" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="274" cy="346" r="15" fill="#315b43"/><text x="274" y="352" text-anchor="middle" font-size="17" fill="white">6</text><text x="298" y="350" font-size="18" fill="#253f34" font-weight="400">마스터 소드</text><text x="298" y="375" font-size="18" fill="#253f34" font-weight="400">마무리</text></g></svg>