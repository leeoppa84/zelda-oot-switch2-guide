<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-label="데스마운틴 분화구 탐색 지점"><title>데스마운틴 분화구 탐색 지점</title><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect width="480" height="340" rx="15" fill="#e8eddf"/><text x="22" y="35" font-size="20" font-weight="700" fill="#253f34">데스마운틴 분화구 탐색 지점</text><text x="22" y="68" font-size="13" fill="#526654">번호는 아래 목록과 대응 · 위치·방향·거리 미표현</text><rect x="16" y="90" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="40" cy="116" r="15" fill="#315b43"/><text x="40" y="122" text-anchor="middle" font-size="17" fill="white">1</text><text x="64" y="120" font-size="18" fill="#253f34" font-weight="400">입구 정면 절벽의</text><text x="64" y="145" font-size="18" fill="#253f34" font-weight="400">구멍</text><rect x="250" y="90" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="274" cy="116" r="15" fill="#315b43"/><text x="274" y="122" text-anchor="middle" font-size="17" fill="white">2</text><text x="298" y="120" font-size="18" fill="#253f34" font-weight="400">워프 지점 근처</text><text x="298" y="145" font-size="18" fill="#253f34" font-weight="400">바위 위</text><rect x="16" y="205" width="222" height="99" rx="9" fill="#fffdf5" stroke="#bac9b1"/><circle cx="40" cy="231" r="15" fill="#315b43"/><text x="40" y="237" text-anchor="middle" font-size="17" fill="white">3</text><text x="64" y="235" font-size="18" fill="#253f34" font-weight="400">입구 왼쪽 아래</text><text x="64" y="260" font-size="18" fill="#253f34" font-weight="400">턱</text></g></svg>