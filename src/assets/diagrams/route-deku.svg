<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><title>거미줄을 뚫는 순서</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ad692d"/></marker></defs><rect width="640" height="420" rx="14" fill="#e8eddf"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#243e32"><text x="25" y="37" font-size="25" font-weight="bold">거미줄을 뚫는 순서</text><text x="25" y="64" font-size="14">원리를 단순화한 설명 그림 · 실제 화면·방 배치 아님</text><path d="M55 120H295M55 220H295M55 290H295" stroke="#7b8b6f" stroke-width="8"/><path d="M165 100V337" stroke="#ad692d" stroke-width="7" marker-end="url(#arrow)"/><ellipse cx="165" cy="287" rx="82" ry="17" fill="#fffdf5" stroke="#9a9c89" stroke-width="3"/><path d="M83 287H247M107 275L226 300M107 300L226 275" stroke="#9a9c89"/><circle cx="165" cy="90" r="16" fill="#315b43"/><text x="340" y="117" font-size="23">① 높은 통로로 이동</text><text x="340" y="225" font-size="23">② 중앙을 향해 낙하</text><text x="340" y="297" font-size="23">③ 거미줄 관통</text><text x="340" y="350" font-size="23">④ 지하 탐색 시작</text><text x="25" y="395" font-size="18">낮은 곳에서 밟거나 검으로 베는 방식이 아닙니다.</text></g></svg>