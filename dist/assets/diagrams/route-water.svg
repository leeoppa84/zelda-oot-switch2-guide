<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><title>수위별로 확인할 장소</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ad692d"/></marker></defs><rect width="640" height="420" rx="14" fill="#e8eddf"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#243e32"><text x="25" y="37" font-size="25" font-weight="bold">수위별로 확인할 장소</text><text x="25" y="64" font-size="14">원리를 단순화한 설명 그림 · 실제 화면·방 배치 아님</text><rect x="38" y="92" width="255" height="260" rx="10" fill="#f8fcfa" stroke="#587e76" stroke-width="4"/><rect x="40" y="192" width="251" height="158" fill="#9dc9c5"/><path d="M40 115H291M40 192H291M40 282H291" stroke="#3d8079" stroke-width="3" stroke-dasharray="9 7"/><rect x="130" y="174" width="68" height="38" fill="#8c9077"/><path d="M165 223V310" stroke="#ad692d" stroke-width="5" marker-end="url(#arrow)"/><text x="320" y="125" font-size="22">높음 → 상층·롱샷 경로</text><text x="320" y="204" font-size="22">중간 → 중앙 탑</text><text x="320" y="237" font-size="18">뜬 블록 아래로 잠수</text><text x="320" y="293" font-size="22">낮음 → 하층 열쇠 탐색</text><text x="26" y="392" font-size="20">수위·현재 층·열쇠를 함께 확인합니다.</text></g></svg>