<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><title>해골의 눈을 여는 순서</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ad692d"/></marker></defs><rect width="640" height="420" rx="14" fill="#e8eddf"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#243e32"><text x="25" y="37" font-size="25" font-weight="bold">해골의 눈을 여는 순서</text><text x="25" y="64" font-size="14">원리를 단순화한 설명 그림 · 실제 화면·방 배치 아님</text><rect x="95" y="150" width="450" height="190" rx="85" fill="#b7bca8" stroke="#7a866c" stroke-width="4"/><circle cx="225" cy="224" r="39" fill="#e8a351" stroke="#885a2a" stroke-width="4"/><circle cx="415" cy="224" r="39" fill="#e8a351" stroke="#885a2a" stroke-width="4"/><circle cx="320" cy="108" r="20" fill="#343b31"/><path d="M310 119L229 178M330 119L410 178" stroke="#ad692d" stroke-width="5" marker-end="url(#arrow)"/><rect x="268" y="284" width="104" height="56" rx="14" fill="#203a30"/><text x="25" y="114" font-size="19">상층 다리에서</text><text x="25" y="140" font-size="19">폭탄을 떨어뜨림</text><text x="195" y="232" font-size="19">왼쪽</text><text x="386" y="232" font-size="19">오른쪽</text><path d="M320 343V369" stroke="#ad692d" stroke-width="4" marker-end="url(#arrow)"/><text x="170" y="402" font-size="22">두 눈을 켜면 입 안으로 진입</text></g></svg>