<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><title>두 시대의 역할 분담</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ad692d"/></marker></defs><rect width="640" height="420" rx="14" fill="#e8eddf"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#243e32"><text x="25" y="37" font-size="25" font-weight="bold">두 시대의 역할 분담</text><text x="25" y="64" font-size="14">원리를 단순화한 설명 그림 · 실제 화면·방 배치 아님</text><rect x="30" y="100" width="270" height="230" rx="13" fill="#fffdf5" stroke="#abb99d"/><rect x="340" y="100" width="270" height="230" rx="13" fill="#d4e3df" stroke="#90b4a9"/><text x="110" y="140" font-size="25" font-weight="bold">소년 시대</text><text x="420" y="140" font-size="25" font-weight="bold">청년 시대</text><text x="65" y="195" font-size="23">왼쪽 작은 구멍</text><text x="65" y="250" font-size="23">은 장갑 획득</text><text x="375" y="195" font-size="23">오른쪽 큰 블록</text><text x="375" y="250" font-size="23">거울 방패 획득</text><path d="M280 270H355" stroke="#ad692d" stroke-width="5" marker-end="url(#arrow)"/><text x="78" y="379" font-size="21">시간의 신전에서 전환 → 레퀴엠으로 재방문</text></g></svg>